# W2-2 evaluation object set — selection registry. `evaluated: true` marks
# objects with real frozen experiment results only: EXP-006 (classical
# baseline, 75 frames) for the anchors, EXP-014 (W2-3 unified 10-frame
# subset) for the five coverage complements. Rationale, candidate pool and
# rejected candidates: docs/EVALUATION_OBJECT_SET.md
# diameters from data/ycbv/models/models_info.json (max point-pair distance, m->mm).

set_size: 7
selection_doc: docs/EVALUATION_OBJECT_SET.md

# Metric policy — pre-registered BEFORE EXP-014 execution. Rule: geometric
# symmetry -> ADD-S, otherwise ADD. This is the project's own pre-registered
# geometry policy: YCB-V models_info.json carries NO symmetry annotations,
# so no claim here may be worded as "official YCB-V symmetry label".
# Anchors keep their historical EXP-006 metric semantics and are never
# re-judged for the sake of a unified table (§10 of the W2-3.1 protocol).
metric_policy:
  rule: symmetric geometry -> ADD-S; otherwise ADD
  policy_source: pre_registered_geometry_policy
  historical_note: anchors (obj5/obj13) follow the frozen EXP-006 conventions

objects:
  - id: 5
    name: 006_mustard_bottle
    role: anchor
    primary_metric: add
    metric_reason: asymmetric; roll near-symmetry is recorded as a failure mode, not a judging symmetry
    policy_source: historical_exp006_convention
    diameter_mm: 196.463
    evaluated: true
    eval_source: EXP-006
    scenes: [50, 52]

  - id: 13
    name: 024_bowl
    role: anchor
    primary_metric: adds
    metric_reason: rotationally symmetric open surface
    policy_source: historical_exp006_convention
    diameter_mm: 161.922
